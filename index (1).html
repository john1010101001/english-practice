      <h2>${step('upload')}Upload your answers <span class="zh">上載答案</span></h2>
      <p>Upload a PDF or a photo of your answers. <span class="zh">可以上載 PDF 或相片。</span></p>
      <label class="btn primary big">${ICON.upload} Choose file <span class="zh" style="color:#fff">選擇檔案</span>
        <input type="file" accept="application/pdf,image/*" class="hidden" data-change="upload-file"></label>
      <div id="upload-state" class="save-state"></div>
      <ul class="filelist" id="filelist"></ul>
    </section>` : ''}
  `);
  if (passage) { renderBestLine(); renderRecorder('idle'); }
  if (task.needs_upload) renderFileList();
}

function renderBestLine() {
  const v = state.view, el = $('#best-line');
  if (!v || !el) return;
  if (!v.attempts.length) { el.textContent = 'You have not tried yet. 你還未讀過。'; return; }
  const best = Math.max(...v.attempts.map(effScore));
  el.innerHTML = `Best so far <span class="zh">最高分</span>: <b>${fmtPct(best)}</b> (${v.attempts.length} ${v.attempts.length > 1 ? 'tries' : 'try'})${best >= v.pm ? ' — passed 合格 ✓' : ''}`;
}

function renderRecorder(mode, extra) {
  const area = $('#rec-area');
  if (!area) return;
  if (!Speech.supported) {
    area.innerHTML = `<div class="warn-box" style="margin-top:1rem">${esc(Speech.MESSAGES.unsupported)}</div>`;
    return;
  }
  if (mode === 'idle') {
    const tried = state.view.result || state.view.attempts.length;
    area.innerHTML = `<div class="recorder">
      ${extra && extra.error ? `<div class="error-box">${esc(extra.error)}</div>` : ''}
      <button class="recbtn" data-act="rec-start" aria-label="Start reading">${ICON.mic}</button>
      <div class="reclabel">${tried ? 'Read again' : 'Start reading'} <span class="zh">${tried ? '再讀一次' : '開始朗讀'}</span></div>
      <div class="small muted">Press the red button, then read the passage. Press it again when you finish. 按紅色按鈕開始，讀完再按一次。</div>
    </div>`;
  } else if (mode === 'starting') {
    area.innerHTML = `<div class="recorder"><button class="recbtn on" disabled aria-label="Starting">${ICON.mic}</button>
      <div class="reclabel">Getting ready… <span class="zh">準備中…</span></div>
      <div class="small muted">If the browser asks, allow the microphone. 如果問你，請按「允許」使用咪高峰。</div></div>`;
  } else if (mode === 'recording') {
    area.innerHTML = `<div class="recorder">
      <button class="recbtn on" data-act="rec-stop" aria-label="Stop">${ICON.stop}</button>
      <div class="reclabel">Reading… press to stop <span class="zh">讀完按這裏停止</span></div>
      <div class="rectime" id="rectime">0:00</div></div>`;
  } else if (mode === 'checking') {
    area.innerHTML = `<div class="recorder"><div class="reclabel"><span class="spinner"></span> Checking… <span class="zh">正在評分…</span></div></div>`;
  }
}

function setPassageLocked(locked) {
  const p = $('#passage'); if (p) p.classList.toggle('locked', locked);
  $$('#read .readbar button').forEach(b => { b.disabled = locked; });
}

async function startReading() {
  const v = state.view;
  Speech.stopSpeaking(); closeWordSheet(); resetListenButton();
  $('#result-area').innerHTML = '';
  // clear old marks
  $$('#passage .w').forEach(el => { el.classList.remove('ok', 'wrong', 'missed', 'unread', 'speaking'); el.dataset.heard = ''; });
  renderRecorder('starting');
  setPassageLocked(true);
  let lastLive = 0, pending = null;
  const live = text => {
    const now = Date.now();
    const run = () => {
      lastLive = Date.now(); pending = null;
      const r = Scoring.score(v.passage.body, text, v.accepted, { live: true });
      const spans = $$('#passage .w');
      let lastOk = null;
      r.words.forEach((w, i) => { if (spans[i]) { const ok = w.status === 'ok'; spans[i].classList.toggle('ok', ok); if (ok) lastOk = spans[i]; } });
      if (lastOk) {
        const rect = lastOk.getBoundingClientRect();
        if (rect.bottom > window.innerHeight - 140 || rect.top < 60) lastOk.scrollIntoView({ block: 'center', behavior: 'smooth' });
      }
    };
    clearTimeout(pending);
    if (now - lastLive > 300) run(); else pending = setTimeout(run, 300);
  };
  const session = new Speech.Session({
    lang: CFG.SPEECH_LANG,
    onText: live,
    onFatal: err => {
      clearInterval(state.timer);
      state.rec = null; setPassageLocked(false);
      renderRecorder('idle', { error: err.message });
    }
  });
  try {
    await session.start();
  } catch (err) {
    setPassageLocked(false);
    renderRecorder('idle', { error: err.message });
    return;
  }
  if (session.fatal) return;
  state.rec = session;
  renderRecorder('recording');
  state.timer = setInterval(() => {
    const t = $('#rectime'); if (t && state.rec) t.textContent = fmtDur(state.rec.seconds());
    if (state.rec && state.rec.seconds() > 15 * 60) stopReading();
  }, 500);
}

async function stopReading() {
  const v = state.view, session = state.rec;
  if (!session) return;
  state.rec = null;
  clearInterval(state.timer);
  renderRecorder('checking');
  const out = await session.stop();
  setPassageLocked(false);
  if (!out.transcript) {
    renderRecorder('idle', { error: "We didn't hear anything. Speak a bit louder and closer to the microphone, then try again. 聽不到你的聲音，請大聲一點，再試一次。" });
    $$('#passage .w').forEach(el => el.classList.remove('ok'));
    return;
  }
  const r = Scoring.score(v.passage.body, out.transcript, v.accepted);
  const passed = r.score >= v.pm;
  v.result = r;
  // long stretches that were not heard at all = parts he did not read
  const unread = new Set();
  let run = [];
  const flush = () => { if (run.length >= 5) run.forEach(i => unread.add(i)); run = []; };
  r.words.forEach((w, i) => { if (w.status === 'skip') return; if (w.status === 'missed') run.push(i); else flush(); });
  flush();
  // show marks on the passage
  const spans = $$('#passage .w');
  r.words.forEach((w, i) => {
    const el = spans[i]; if (!el) return;
    el.classList.remove('ok', 'wrong', 'missed', 'unread');
    if (unread.has(i)) el.classList.add('unread');
    else if (w.status === 'ok' || w.status === 'wrong' || w.status === 'missed') el.classList.add(w.status);
    el.dataset.heard = w.heard || '';
  });
  const practise = [];
  const seen = new Set();
  r.words.forEach((w, i) => {
    if (!unread.has(i) && (w.status === 'wrong' || w.status === 'missed')) {
      const c = Scoring.cleanWord(w.text); const k = c.toLowerCase();
      if (c && !seen.has(k)) { seen.add(k); practise.push(c); }
    }
  });
  $('#result-area').innerHTML = `<div class="result ${passed ? 'pass' : 'fail'}">
    <div class="score-line"><span class="score-big">${fmtPct(r.score)}</span>
      <span class="verdict">${passed ? 'Passed! <span class="zh">合格！</span>' : 'Not yet <span class="zh">未合格</span>'}</span></div>
    <p>${passed ? `Well done! You read ${r.correct} of ${r.total} words correctly. 做得好！`
      : `You read ${r.correct} of ${r.total} words correctly. You need ${v.pm}%. Practise the red words and try again. 練習紅色的字，然後再試一次。`}</p>
    <div class="legend"><span><span class="w ok">yellow</span> = read correctly 讀對</span><span><span class="w wrong">red</span> = practise this word 要再練習</span>${unread.size ? '<span><span class="w unread">grey</span> = not read 沒有讀</span>' : ''}</div>
    ${unread.size ? '<div class="warn-box">Some parts were not heard at all (grey). Read the whole passage next time. 灰色部分沒有聽到，下次要讀完整篇。</div>' : ''}
    ${practise.length ? `<h3>Words to practise <span class="zh">要練習的字</span></h3>
      <div class="practice-words">${practise.slice(0, 30).map(w => `<button type="button" data-act="say" data-text="${esc(w)}">${ICON.speaker.replace('<svg', '<svg style="width:1em;height:1em;vertical-align:-.1em"')} ${esc(w)}</button>`).join('')}</div>` : ''}
    <div id="save-state" class="save-state">Saving… 儲存中…</div>
  </div>`;
  renderRecorder('idle');
  $('#result-area').scrollIntoView({ behavior: 'smooth', block: 'start' });
  const row = {
    task_id: v.task.id, student_id: state.me.id, passage_text: v.passage.body, transcript: out.transcript,
    score: r.score, pass_mark: v.pm, passed, word_results: Scoring.pack(r), duration_sec: out.duration,
    device: Speech.deviceName() + (out.audioDropped ? ' (no sound file)' : '')
  };
  v.pendingSave = { row, blob: out.blob, mime: out.mime };
  await saveAttempt();
}

async function saveAttempt() {
  const v = state.view; if (!v || !v.pendingSave) return;
  const el = $('#save-state');
  if (el) { el.className = 'save-state'; el.textContent = 'Saving… 儲存中…'; }
  try {
    const { row, blob, mime } = v.pendingSave;
    const res = await db.createAttempt(row, blob, mime);
    v.attempts.push(Object.assign({ id: res.id, created_at: new Date().toISOString(), teacher_score: null }, row));
    v.pendingSave = null;
    if (el && el.isConnected) { el.className = 'save-state good'; el.textContent = 'Saved. Your teacher can see this try. 已儲存，老師可以看到。'; }
    renderBestLine();
  } catch (err) {
    console.error(err);
    if (el && el.isConnected) {
      el.className = 'save-state bad';
      el.innerHTML = `Not saved: ${esc(err.message)} 未能儲存。 <button class="btn small" data-act="save-again">Save again 再儲存</button>`;
    }
  }
}

function resetListenButton() {
  const b = $('#listen-btn');
  if (b) b.innerHTML = `${ICON.speaker} Listen first <span class="zh">先聽一次</span>`;
  $$('#passage .w.speaking').forEach(el => el.classList.remove('speaking'));
  if (state.view) state.view.speaking = false;
}
function toggleListen() {
  const v = state.view; if (!v || !v.passage) return;
  if (v.speaking) { Speech.stopSpeaking(); resetListenButton(); return; }
  if (!Speech.canSpeak) { toast('This browser cannot read aloud.', true); return; }
  const sents = sentencesOf(v.passage.body);
  const spans = $$('#passage .w');
  v.speaking = true;
  $('#listen-btn').innerHTML = `${ICON.stop} Stop <span class="zh">停止</span>`;
  Speech.speakQueue(sents.map(s => s.text), {
    rate: state.rate, lang: CFG.SPEECH_LANG,
    onPart: idx => {
      $$('#passage .w.speaking').forEach(el => el.classList.remove('speaking'));
      sents[idx].ix.forEach(i => spans[i] && spans[i].classList.add('speaking'));
      const first = spans[sents[idx].ix[0]];
      if (first) { const r = first.getBoundingClientRect(); if (r.bottom > innerHeight - 120 || r.top < 40) first.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
    },
    onDone: resetListenButton
  });
}

async function renderFileList() {
  const v = state.view, ul = $('#filelist'); if (!ul) return;
  ul.innerHTML = v.subs.slice().reverse().map(s => `<li>
    <div class="row"><b>${esc(s.file_name)}</b><span class="spacer"></span>
      <button class="btn small" data-act="open-sub" data-id="${esc(s.id)}">Open 打開</button></div>
    <div class="small muted">Uploaded 已上載 ${esc(fmtWhen(s.created_at))}</div>
    ${s.feedback ? `<div class="feedback"><b>Teacher's comments 老師的意見:</b>\n${esc(s.feedback)}</div>` : ''}
  </li>`).join('');
}

const forms = {

function onClick(e) {
  const w = e.target.closest('.passage .w');
  if (w && !e.target.closest('[data-act]') && state.view && !state.rec && !w.closest('.passage.locked')) {
    if (typeof onTeacherWord === 'function' && w.closest('[data-attempt]')) return onTeacherWord(w);
    const word = Scoring.cleanWord(w.textContent.replace(w.querySelector('.heard')?.textContent || '', ''));
    if (!word) return;
    const meaning = w.dataset.g && state.view.gloss ? state.view.gloss.get(w.dataset.g) : null;
    const phrase = w.dataset.g || word;
    Speech.speak(phrase, { rate: Math.min(state.rate, 0.85), lang: CFG.SPEECH_LANG });
    showWordSheet(phrase, meaning, w.dataset.heard);
    return;
  }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const fn = actions[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el, e); }
}
app.addEventListener('click', onClick);
app.addEventListener('change', e => { const fn = changes[e.target.dataset.change]; if (fn) fn(e.target, e); });
app.addEventListener('input', e => { const fn = (typeof inputs !== 'undefined') && inputs[e.target.dataset.input]; if (fn) fn(e.target, e); });
app.addEventListener('submit', e => { const fn = forms[e.target.dataset.form]; if (fn) { e.preventDefault(); fn(e.target, e); } });
window.addEventListener('hashchange', render);

/* =====================================================================
   Teacher pages: Progress, Tasks, one task (attempts + uploads),
   Passages, Students, Word rules
   ===================================================================== */
async function loadAll() {
  const [students, passages, tasks, attempts, subs, accepted] = await Promise.all([
    db.listStudents(), db.listPassages(), db.listTasks(), db.listAttempts(), db.listSubmissions(), db.listAccepted()
  ]);
  const byId = list => new Map(list.map(x => [x.id, x]));
  return { students, passages, tasks, attempts, subs, accepted, S: byId(students), P: byId(passages), T: byId(tasks) };
}
function triesHTML(st, pm) {
  if (!st.attempts.length) return '<span class="muted">No tries yet</span>';
  const list = st.attempts.slice(-8);
  return `<span class="tries">${st.attempts.length > 8 ? '<span>…</span>' : ''}${list.map(a => {
    const s = effScore(a);
    return `<span class="${s >= pm ? 'p' : ''}" title="${esc(fmtWhen(a.created_at))}">${Math.round(s)}</span>`;
  }).join('')}</span>`;
}
function readCell(t, st, pm) {
  if (!t.passage_id && !st.attempts.length) return '<span class="muted">—</span>';
  const chip = st.read === 'pass' ? `<span class="chip pass">Passed ✓</span>` : st.read === 'again' ? `<span class="chip again">Not passed yet</span>` : `<span class="chip todo">Not started</span>`;
  return `${chip}<div class="small" style="margin-top:.3rem">Best ${st.best !== null ? fmtPct(st.best) : '—'} / pass ${pm}%</div><div style="margin-top:.3rem">${triesHTML(st, pm)}</div>`;
}
function uploadCell(t, st) {
  if (!t.needs_upload) return '<span class="muted">—</span>';
  if (!st.files.length) return '<span class="chip todo">Not uploaded</span>';
  const waiting = st.files.filter(s => !s.feedback).length;
  return `<span class="chip pass">${st.files.length} file${st.files.length > 1 ? 's' : ''}</span>${waiting ? `<div class="small" style="margin-top:.3rem;color:var(--amber)">${waiting} without your comment</div>` : ''}`;
}

/* ---------- Progress ---------- */
async function viewProgress() {
  loadingFrame();
  const d = await loadAll();
  const active = d.students.filter(s => s.active !== false);
  const events = [
    ...d.attempts.map(a => ({ when: a.created_at, html: `<b>${esc(d.S.get(a.student_id)?.display_name || '?')}</b> read <a href="#/t/task/${esc(a.task_id)}">${esc(d.T.get(a.task_id)?.title || 'a task')}</a>: ${fmtPct(effScore(a))} ${effScore(a) >= Number(a.pass_mark) ? '<span class="chip pass">pass</span>' : '<span class="chip again">not yet</span>'}` })),
    ...d.subs.map(s => ({ when: s.created_at, html: `<b>${esc(d.S.get(s.student_id)?.display_name || '?')}</b> uploaded <a href="#/t/task/${esc(s.task_id)}">${esc(s.file_name)}</a> for ${esc(d.T.get(s.task_id)?.title || 'a task')}` }))
  ].sort((a, b) => b.when.localeCompare(a.when)).slice(0, 10);

  const studentBlock = s => {
    const tasks = d.tasks.filter(t => t.student_id === s.id && !t.archived);
    const rows = tasks.map(t => ({ t, pm: passMarkFor(t, s) })).map(x => Object.assign(x, { st: taskState(x.t, d.attempts, d.subs, x.pm) }));
    const myAttempts = d.attempts.filter(a => a.student_id === s.id);
    const last = [...myAttempts.map(a => a.created_at), ...d.subs.filter(x => x.student_id === s.id).map(x => x.created_at)].sort().pop();
    const weekAgo = Date.now() - 7 * 864e5;
    const thisWeek = myAttempts.filter(a => new Date(a.created_at).getTime() > weekAgo).length;
    const waiting = d.subs.filter(x => x.student_id === s.id && !x.feedback).length;
    return `<section class="sheet">
      <div class="student-head"><h2>${esc(s.display_name)}</h2><span class="muted">username ${esc(s.username)}, pass mark ${s.pass_mark}%</span></div>
      <div class="stats">
        <div class="stat"><b>${rows.filter(r => !r.st.done).length}</b><span>tasks not finished</span></div>
        <div class="stat"><b>${thisWeek}</b><span>read-aloud tries this week</span></div>
        <div class="stat"><b>${waiting}</b><span>uploads without your comment</span></div>
        <div class="stat"><b style="font-size:1.05rem;line-height:1.9">${last ? esc(fmtWhen(last)) : 'never'}</b><span>last active</span></div>
      </div>
      ${rows.length ? `<div class="tblwrap"><table class="tbl stack"><thead><tr><th>Task</th><th>Read aloud</th><th>Upload</th><th>Last activity</th><th></th></tr></thead><tbody>
        ${rows.map(({ t, st, pm }) => `<tr>
          <td data-l="Task"><b>${esc(t.title)}</b>${t.due_date ? `<div class="small muted">Due ${esc(fmtDate(t.due_date))}</div>` : ''}</td>
          <td data-l="Read aloud">${readCell(t, st, pm)}</td>
          <td data-l="Upload">${uploadCell(t, st)}</td>
          <td data-l="Last activity" class="small">${st.last ? esc(fmtWhen(st.last)) : '<span class="muted">—</span>'}</td>
          <td><a class="btn small" href="#/t/task/${esc(t.id)}">Open</a></td></tr>`).join('')}
      </tbody></table></div>` : `<p class="muted">No tasks for ${esc(s.display_name)} yet. <a href="#/t/tasks">Assign one</a>.</p>`}
    </section>`;
  };

/* tap a red word in an attempt: accept it */
function onTeacherWord(w) {
  const det = w.closest('[data-attempt]');
  const a = state.view.attempts.find(x => x.id === det.dataset.attempt);
  if (!a || !w.classList.contains('wrong')) {
    Speech.speak(Scoring.cleanWord(w.firstChild.textContent), { rate: 0.85, lang: CFG.SPEECH_LANG });
    return;
  }
  const expected = Scoring.cleanWord(w.firstChild.textContent).toLowerCase();
  const heard = w.querySelector('.heard').textContent;
  const s = state.view.student;
  const dlg = document.createElement('dialog');
  dlg.innerHTML = `<form method="dialog" data-dialog="accept">
    <h3>Accept “${esc(heard)}” for “${esc(expected)}”?</h3>
    <p class="small">Do this when the student read the word well but the computer wrote something else, for example a name or his accent.</p>
    <label class="check"><input type="radio" name="who" value="one" checked> Only for ${esc(s ? s.display_name : 'this student')}</label>
    <label class="check"><input type="radio" name="who" value="all"> For all students</label>
    <label class="check"><input type="checkbox" name="rescore" checked> Mark this try again now</label>
    <div class="form-actions"><button class="btn primary" value="ok">Accept</button><button class="btn" value="cancel">Cancel</button></div>
  </form>`;
  document.body.appendChild(dlg);
  dlg.addEventListener('close', async () => {
    const f = dlg.querySelector('form'), ok = dlg.returnValue === 'ok';
    const who = f.who.value, rescore = f.rescore.checked;
    dlg.remove();
    if (!ok) return;
    try {
      await db.addAccepted({ student_id: who === 'all' ? null : a.student_id, expected, heard });
      toast('Word rule added');
      if (rescore) await rescoreAttempt(a.id, true);
      else render();
    } catch (err) { toast(err.message, true); }
  });
  dlg.showModal();
}
async function rescoreAttempt(id, keepOpen) {
  const v = state.view, a = v.attempts.find(x => x.id === id), before = Number(a.score);
  const accepted = (await db.listAccepted()).filter(r => !r.student_id || r.student_id === a.student_id);
  const r = Scoring.score(a.passage_text, a.transcript, accepted);
  await db.updateAttempt(id, { score: r.score, passed: r.score >= Number(a.pass_mark), word_results: Scoring.pack(r) });
  toast(`Marked again: ${fmtPct(r.score)} (was ${fmtPct(before)})`);
  await render();
  if (keepOpen) { const el = document.querySelector(`[data-attempt="${CSS.escape(id)}"]`); if (el) { el.open = true; el.scrollIntoView({ block: 'start' }); } }
}

        <div class="form-actions"><button class="btn primary">Add student</button></div>
      </form>
    </section>
    <section class="sheet">
      <h2>Your teacher account</h2>
      <p>You log in with the login name <b>${esc(state.me.username || '')}</b>. Students can't open these pages without your password.</p>
      <form data-form="teacher-password" class="grid2">
        <label class="field"><span>New password (at least 8 characters)</span><input name="password" type="password" minlength="8" autocomplete="new-password" required></label>
        <label class="field"><span>Type it again</span><input name="password2" type="password" minlength="8" autocomplete="new-password" required></label>
        <div class="form-actions"><button class="btn">Change password</button></div>
      </form>
    </section>`, { tabs: 'students', wide: true });
}

/* ---------- Word rules ---------- */
async function viewWordRules() {
  loadingFrame();
  const [rules, students] = await Promise.all([db.listAccepted(), db.listStudents()]);
  const S = new Map(students.map(s => [s.id, s]));
  app.innerHTML = frame(`
    <h1>Word rules</h1>
    <div class="note-box">The speech recognition sometimes writes a different word even when the student read well (names, Cantonese words, his accent).
      A word rule tells the marking to accept it. The quickest way to add one: open a try on a task page and tap the red word.
      Numbers, “don't / do not”, British and American spelling and words that sound the same (two / too, read / red) are accepted already.</div>
    <section class="sheet">
      <h2>Add a rule</h2>
      <form data-form="rule-add" class="grid2">
        <label class="field"><span>Word in the passage</span><input name="expected" required placeholder="they"></label>
        <label class="field"><span>Also accept when the computer hears</span><input name="heard" required placeholder="day"></label>
        <label class="field"><span>For</span><select name="student_id"><option value="">All students</option>${students.map(s => `<option value="${esc(s.id)}">${esc(s.display_name)} only</option>`).join('')}</select></label>
        <div class="form-actions" style="align-self:end;margin-bottom:.9rem"><button class="btn primary">Add rule</button></div>
      </form>
    </section>
    <section class="sheet">
      <h2>Rules (${rules.length})</h2>
      ${rules.length ? `<div class="tblwrap"><table class="tbl stack"><thead><tr><th>Passage word</th><th>Accept</th><th>For</th><th>Added</th><th></th></tr></thead><tbody>
        ${rules.map(r => `<tr><td data-l="Passage word"><b>${esc(r.expected)}</b></td><td data-l="Accept">${esc(r.heard)}</td>
          <td data-l="For">${r.student_id ? esc(S.get(r.student_id)?.display_name || '?') : 'All students'}</td>
          <td data-l="Added" class="small">${esc(fmtWhen(r.created_at))}</td>
          <td><button class="btn small danger" data-act="rule-del" data-id="${esc(r.id)}">Remove</button></td></tr>`).join('')}
      </tbody></table></div>` : '<p class="muted">No rules yet.</p>'}
    </section>`, { tabs: 'words', wide: true });
}

/* ---------- teacher actions ---------- */
Object.assign(actions, {
  'task-archive': async el => busy(el, async () => { await db.updateTask(el.dataset.id, { archived: el.dataset.v === '1' }); await render(); }),
  'task-delete': async el => {
    if (!confirm('Delete this task, all its tries, recordings and uploaded files? This cannot be undone.')) return;
    await busy(el, async () => { await db.deleteTask(el.dataset.id); toast('Task deleted'); go('#/t/progress'); });
  },
  't-audio': async el => busy(el, async () => {
    const a = state.view.attempts.find(x => x.id === el.dataset.id);
    const url = await db.fileUrl('recordings', a.audio_path);
    const holder = el.closest('[data-audio]');
    holder.innerHTML = `<audio controls autoplay preload="auto" src="${esc(url)}" style="max-width:100%"></audio>`;
  }),
  't-rescore': async el => busy(el, () => rescoreAttempt(el.dataset.id, true)),
  't-del-attempt': async el => {
    if (!confirm('Delete this try and its recording?')) return;
    await busy(el, async () => { await db.deleteAttempt(state.view.attempts.find(x => x.id === el.dataset.id)); toast('Try deleted'); await render(); });
  },
  't-open-sub': async el => busy(el, async () => {
    const s = state.view.subs.find(x => x.id === el.dataset.id);
    window.open(await db.fileUrl('submissions', s.file_path), '_blank');
  }),
  't-del-sub': async el => {
    if (!confirm('Delete this uploaded file?')) return;
    await busy(el, async () => { await db.deleteSubmission(state.view.subs.find(x => x.id === el.dataset.id)); toast('File deleted'); await render(); });
  },
  't-open-material': async el => busy(el, async () => { window.open(await db.fileUrl('materials', state.view.task.attachment_path), '_blank'); }),
  'passage-assign': el => { state.prefillPassage = el.dataset.id; go('#/t/tasks'); },
  'passage-delete': async el => {
    if (!confirm('Delete this passage? Tasks that use it will no longer have reading aloud. Old tries are kept.')) return;
    await busy(el, async () => { await db.deletePassage(el.dataset.id); toast('Passage deleted'); go('#/t/passages'); });
  },
  'student-active': async el => busy(el, async () => { await db.updateStudent(el.dataset.id, { active: el.dataset.v === '1' }); await render(); }),
  'student-pin': async el => {
    const pin = prompt(`New 6-digit PIN for ${el.dataset.name}:`);
    if (pin === null) return;
    if (!/^\d{6}$/.test(pin.trim())) { toast('The PIN must be exactly 6 digits.', true); return; }
    await busy(el, async () => { await db.setStudentPin(el.dataset.id, pin.trim()); toast(`New PIN saved for ${el.dataset.name}`); });
  },
  'rule-del': async el => busy(el, async () => { await db.deleteAccepted(el.dataset.id); await render(); })
});
Object.assign(changes, {
  'show-archived': el => { state.showArchived = el.checked; render(); },
  'task-passage': el => {
    const f = el.form, d = state.tdata; if (!f || !d) return;
    $('#new-passage').classList.toggle('hidden', el.value !== 'new');
    const p = d.P.get(el.value);
    if (p && (!f.title.value || f.dataset.autoTitle === f.title.value)) { f.title.value = p.title; f.dataset.autoTitle = p.title; }
  }
});
Object.assign(forms, {
  'task-create': async f => {
    const fd = new FormData(f), btn = $('button.primary', f);
    const studentIds = fd.getAll('students');
    if (!studentIds.length) { toast('Tick at least one student.', true); return; }
    const title = String(fd.get('title') || '').trim();
    const sel = String(fd.get('passage_id') || '');
    const body = String(fd.get('passage_body') || '').replace(/\r/g, '').trim();
    const exercise_text = String(fd.get('exercise_text') || '').replace(/\r/g, '').trim();
    const needs_upload = !!fd.get('needs_upload');
    const file = f.attachment.files[0];
    const newText = sel === 'new' && !!body;
    let passage_id = sel && sel !== 'new' ? sel : null;
    if (!passage_id && !newText && !exercise_text && !needs_upload && !file) {
      toast('Paste a text to read aloud or some questions, or tick "uploads his answers".', true); return;
    }
    await busy(btn, async () => {
      if (newText) passage_id = await db.savePassage({ title, body, glossary: String(fd.get('passage_glossary') || '').trim() });
      let attachment_path = null, attachment_name = null;
      if (file) { attachment_path = await db.uploadMaterial(file); attachment_name = file.name; }
      const pmRaw = String(fd.get('pass_mark') || '').trim();
      for (const sid of studentIds) {
        await db.createTask({
          student_id: sid, title, instructions: String(fd.get('instructions') || '').trim(), exercise_text,
          passage_id, needs_upload, pass_mark: pmRaw === '' ? null : Math.max(0, Math.min(100, Number(pmRaw))),
          due_date: fd.get('due_date') || null, attachment_path, attachment_name
        });
      }
      toast(studentIds.length > 1 ? `Task given to ${studentIds.length} students` : 'Task assigned');
      await render();
    });
  },
  'task-edit': async f => {
    const fd = new FormData(f);
    await busy($('button.primary', f), async () => {
      const pmRaw = String(fd.get('pass_mark') || '').trim();
      await db.updateTask(f.dataset.id, {
        title: String(fd.get('title')).trim(), instructions: String(fd.get('instructions') || '').trim(),
        exercise_text: String(fd.get('exercise_text') || '').replace(/\r/g, '').trim(),
        passage_id: fd.get('passage_id') || null, pass_mark: pmRaw === '' ? null : Math.max(0, Math.min(100, Number(pmRaw))),
        due_date: fd.get('due_date') || null, needs_upload: !!fd.get('needs_upload'), archived: !!fd.get('archived')
      });
      toast('Task saved'); await render();
    });
  },
  't-mark': async f => {
    const fd = new FormData(f), raw = String(fd.get('teacher_score') || '').trim();
    const a = state.view.attempts.find(x => x.id === f.dataset.id);
    await busy($('button', f), async () => {
      const ts = raw === '' ? null : Math.max(0, Math.min(100, Number(raw)));
      const eff = ts === null ? Number(a.score) : ts;
      await db.updateAttempt(a.id, { teacher_score: ts, teacher_note: String(fd.get('teacher_note') || '').trim() || null, passed: eff >= Number(a.pass_mark) });
      toast(ts === null ? 'Back to the computer mark' : 'Mark saved');
      await render();
      const el = document.querySelector(`[data-attempt="${CSS.escape(a.id)}"]`); if (el) el.open = true;
    });
  },
  't-feedback': async f => {
    const fd = new FormData(f);
    await busy($('button', f), async () => {
      const fb = String(fd.get('feedback') || '').trim();
      await db.updateSubmission(f.dataset.id, { feedback: fb || null, feedback_at: fb ? new Date().toISOString() : null });
      toast('Comment saved. The student can see it.');
      await render();
    });
  },
  'passage-save': async f => {
    const fd = new FormData(f);
    await busy($('button.primary', f), async () => {
      const id = await db.savePassage({ id: f.dataset.id || null, title: String(fd.get('title')).trim(), body: String(fd.get('body')).replace(/\r/g, '').trim(), glossary: String(fd.get('glossary') || '').trim() });
      toast('Passage saved');
      if (!f.dataset.id) go('#/t/passage/' + id);
    });
  },
  'student-add': async f => {
    const fd = new FormData(f);
    const name = String(fd.get('name')).trim(), username = String(fd.get('username')).trim().toLowerCase(), pin = String(fd.get('pin')).trim();
    if (!USERNAME_RE.test(username)) { toast('The username can only have small letters, numbers, dots, dashes and underscores.', true); return; }
    if (!/^\d{6}$/.test(pin)) { toast('The PIN must be exactly 6 digits.', true); return; }
    await busy($('button', f), async () => {
      await db.addStudent({ name, username, pin, passMark: Number(fd.get('pass_mark')) || 90 });
      toast(`${name} added. Username: ${username}`);
      await render();
    });
  },
  'student-pm': async f => {
    const v = Math.max(0, Math.min(100, Number(new FormData(f).get('pass_mark'))));
    await busy($('button', f), async () => { await db.updateStudent(f.dataset.id, { pass_mark: v }); toast('Pass mark saved'); });
  },
  'teacher-password': async f => {
    const fd = new FormData(f), pw = String(fd.get('password') || '');
    if (pw.length < 8) { toast('The password needs at least 8 characters.', true); return; }
    if (pw !== String(fd.get('password2') || '')) { toast('The two passwords are not the same.', true); return; }
    await busy($('button', f), async () => { await db.changePassword(pw); f.reset(); toast('Password changed'); });
  },
  'rule-add': async f => {
    const fd = new FormData(f);
    await busy($('button', f), async () => {
      await db.addAccepted({ expected: String(fd.get('expected')).trim().toLowerCase(), heard: String(fd.get('heard')).trim().toLowerCase(), student_id: fd.get('student_id') || null });
      toast('Rule added'); await render();
    });
  }
});

/* ---------- start ---------- */
render();

</script>
</body>
</html>
